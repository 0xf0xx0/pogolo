name: pogolo

services:
  gotty:
    image: sorenisanerd/gotty:v1.6.0@sha256:23b4669973e96d8d7d37b3bfd9e6566bdd701aa1a56eee2dc0e0362bd927ed88
    restart: on-failure
    user: "1000:1000"
    stop_grace_period: 1m
    command: ["gotty", "--port", "5663", "--width", "80", "--title-format", "pogolo (on Docker)", "sh", "-c", "tail -n 10000 -f /data/pogolo.log"]
    volumes:
      - ${APP_DATA_DIR}/data:/data

  pogolo:
    build: .
    restart: on-failure
    user: "1000:1000"
    stop_grace_period: 15s
    volumes:
      # expects to be run with a pogolo.toml in the same dir
      - ./pogolo.toml:/config/pogolo.toml:ro
    ports:
      - "5661:5661"
      - "5662:5662"
    environment:
      POGOLO_HOST: "0.0.0.0"
      POGOLO_BACKEND_HOST: "host:port" # adjust
      POGOLO_BACKEND_RPCAUTH: "user:pass" # adjust
      # comment to disable colors
      FORCE_COLOR: 1
    command: ["/pogolo", "--conf", "/data/pogolo.toml", "--logfile", "/data/pogolo.log"]
